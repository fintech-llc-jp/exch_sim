# JWT Configuration
jwt.secret=your-256-bit-secret-key-here-make-it-long-and-secure
jwt.expiration=86400000

# Server Configuration
server.port=8080


# H2 Database Configuration
spring.datasource.url=jdbc:h2:file:./data/executions
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Instrument Configuration
app.instruments.G_BTCJPY.name=G_BTCJPY
app.instruments.G_BTCJPY.priceMultiplier=1
app.instruments.G_BTCJPY.qtyMultiplier=1000
app.instruments.G_BTCJPY.type=Cash

app.instruments.G_FX_BTCJPY.name=G_FX_BTCJPY
app.instruments.G_FX_BTCJPY.priceMultiplier=1
app.instruments.G_FX_BTCJPY.qtyMultiplier=1000
app.instruments.G_FX_BTCJPY.type=FX

app.instruments.B_BTCJPY.name=B_BTCJPY
app.instruments.B_BTCJPY.priceMultiplier=1
app.instruments.B_BTCJPY.qtyMultiplier=1000
app.instruments.B_BTCJPY.type=Cash

app.instruments.B_FX_BTCJPY.name=B_FX_BTCJPY
app.instruments.B_FX_BTCJPY.priceMultiplier=1
app.instruments.B_FX_BTCJPY.qtyMultiplier=1000
app.instruments.B_FX_BTCJPY.type=FX

app.instruments.TESTJPY.name=Test/Japanese Yen
app.instruments.TESTJPY.priceMultiplier=1
app.instruments.TESTJPY.qtyMultiplier=1000
app.instruments.TESTJPY.type=Cash

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}

# Redis Pub/Sub Configuration
redis.pubsub.enabled=true
redis.pubsub.market-make.channel-pattern=market-make:*
redis.pubsub.trade-insert.channel-pattern=trade-insert:*

# BigQuery Configuration
spring.cloud.gcp.project-id=tradingscreen
spring.cloud.gcp.bigquery.dataset-name=repository
# 認証情報は環境変数 GOOGLE_APPLICATION_CREDENTIALS で提供

# Authentication Configuration
app.auth.bigquery-enabled=true

# Authentication Cache Configuration
app.auth.cache-ttl-minutes=5
app.auth.cache-max-size=1000

# Data Migration Configuration
app.data-migration.enabled=true
app.data-migration.phase=add-persistence
app.data-migration.memory-cache-enabled=true
app.data-migration.database-persistence-enabled=true
app.data-migration.migrate-positions=true
app.data-migration.migrate-trade-history=true
app.data-migration.bigquery-enabled=true


# Default Users Configuration
app.default-users[0].username=admin
app.default-users[0].password=admin123
app.default-users[0].roles=ROLE_ADMIN,ROLE_USER
app.default-users[1].username=trader001
app.default-users[1].password=trader123
app.default-users[1].roles=ROLE_USER
app.default-users[2].username=marketmaker1
app.default-users[2].password=mm123
app.default-users[2].roles=ROLE_MARKET_MAKER,ROLE_USER
