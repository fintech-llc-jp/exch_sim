# JWT Configuration
jwt.secret=your-256-bit-secret-key-here-make-it-long-and-secure
jwt.expiration=86400000

# Server Configuration
server.port=8080


# H2 Database Configuration
spring.datasource.url=jdbc:h2:file:./data/executions
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Instrument Configuration
app.instruments.G_BTCJPY.name=G_BTCJPY
app.instruments.G_BTCJPY.priceMultiplier=1
app.instruments.G_BTCJPY.qtyMultiplier=1000
app.instruments.G_BTCJPY.type=Cash

app.instruments.G_FX_BTCJPY.name=G_FX_BTCJPY
app.instruments.G_FX_BTCJPY.priceMultiplier=1
app.instruments.G_FX_BTCJPY.qtyMultiplier=1000
app.instruments.G_FX_BTCJPY.type=FX

app.instruments.B_BTCJPY.name=B_BTCJPY
app.instruments.B_BTCJPY.priceMultiplier=1
app.instruments.B_BTCJPY.qtyMultiplier=1000
app.instruments.B_BTCJPY.type=Cash

app.instruments.B_FX_BTCJPY.name=B_FX_BTCJPY
app.instruments.B_FX_BTCJPY.priceMultiplier=1
app.instruments.B_FX_BTCJPY.qtyMultiplier=1000
app.instruments.B_FX_BTCJPY.type=FX

app.instruments.TESTJPY.name=Test/Japanese Yen
app.instruments.TESTJPY.priceMultiplier=1
app.instruments.TESTJPY.qtyMultiplier=1000
app.instruments.TESTJPY.type=Cash


# BigQuery Configuration
spring.cloud.gcp.project-id=tradingscreen
spring.cloud.gcp.bigquery.dataset-name=repository
# 認証情報は環境変数 GOOGLE_APPLICATION_CREDENTIALS で提供


# Data Migration Configuration
app.data-migration.enabled=true
app.data-migration.phase=add-persistence
app.data-migration.memory-cache-enabled=true
app.data-migration.database-persistence-enabled=true
app.data-migration.migrate-positions=true
app.data-migration.migrate-trade-history=true
app.data-migration.bigquery-enabled=true


# Authentication Configuration
app.auth.bigquery-enabled=true

# Default Users Configuration
app.default-users[0].username=admin
app.default-users[0].password=admin123
app.default-users[0].roles=ROLE_ADMIN,ROLE_USER
app.default-users[1].username=trader001
app.default-users[1].password=trader123
app.default-users[1].roles=ROLE_USER
app.default-users[2].username=marketmaker1
app.default-users[2].password=mm123
app.default-users[2].roles=ROLE_MARKET_MAKER,ROLE_USER

# Market Data Configuration
# Bitflyer Configuration
market-data.bitflyer.enabled=true
market-data.bitflyer.ws-url=wss://ws.lightstream.bitflyer.com/json-rpc
market-data.bitflyer.reconnect-delay=5000
market-data.bitflyer.max-reconnect-attempts=10

# GMO Configuration
market-data.gmo.enabled=true
market-data.gmo.ws-url=wss://api.coin.z.com/ws/public/v1
market-data.gmo.reconnect-delay=5000
market-data.gmo.max-reconnect-attempts=10

# Symbol Mapping Configuration
market-data.symbol-mapping.BITFLYER.BTC_JPY=B_BTCJPY
market-data.symbol-mapping.BITFLYER.FX_BTC_JPY=B_FX_BTCJPY
market-data.symbol-mapping.GMO.BTC_JPY=G_FX_BTCJPY
market-data.symbol-mapping.GMO.BTC=G_BTCJPY

# Data Processing Configuration
market-data.board.max-levels=10
market-data.trade.batch-size=100

# Async Processing Configuration
market-data.async.core-pool-size=4
market-data.async.max-pool-size=8
market-data.async.queue-capacity=1000
market-data.async.thread-name-prefix=MarketData-

# Phase 3: Order Guarantee Configuration
market-data.trade.ordering.enabled=true
market-data.trade.ordering.shutdown-timeout=5000

# Phase 3: BigQuery Async Save Configuration
market-data.bigquery.async.enabled=true
market-data.bigquery.async.core-pool-size=2
market-data.bigquery.async.max-pool-size=4
market-data.bigquery.async.queue-capacity=500

# Phase 3: H2 Data Retention Configuration
market-data.h2.retention-days=7
market-data.h2.max-records=10000000
market-data.h2.cleanup.enabled=true
market-data.h2.cleanup.batch-size=1000
market-data.h2.emergency-cleanup-threshold=0.9

# WebSocket Debug Logging
logging.level.reactor.netty.http.client=DEBUG
logging.level.reactor.netty.tcp=DEBUG
logging.level.com.ys.exch_sim.domain.market_data.client=DEBUG
