# BigQuery用の設定ファイル
# 使用例: java -jar app.jar --spring.profiles.active=bigquery
# または、application.propertiesで app.database.type=bigquery を設定

# Database Configuration
app.database.type=bigquery

# BigQueryモードではJPA/DataSourceの自動設定を除外
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# Data Migration Configuration
app.data-migration.enabled=true
app.data-migration.bigquery-enabled=true

