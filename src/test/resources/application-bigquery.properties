# BigQuery Test Configuration
spring.cloud.gcp.project-id=tradingscreen
spring.cloud.gcp.bigquery.dataset-name=test_repository
# 認証情報は環境変数 GOOGLE_APPLICATION_CREDENTIALS で提供

# Data Migration Configuration for BigQuery Testing
app.data-migration.enabled=true
app.data-migration.phase=bigquery-test
app.data-migration.memory-cache-enabled=true
app.data-migration.database-persistence-enabled=false
app.data-migration.migrate-positions=true
app.data-migration.migrate-trade-history=true
app.data-migration.bigquery-enabled=true

# H2 Database Configuration for Tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false

# JWT Configuration for tests
jwt.secret=test-secret-key-for-testing-purposes-only-must-be-long-enough
jwt.expiration=86400000

# Server Configuration
server.port=0

# User Configuration for tests
app.users.file-path=./test-users-bigquery.json

# Redis Configuration for tests (disable)
redis.pubsub.enabled=false

# Authentication Configuration for BigQuery tests
app.auth.bigquery-enabled=false

# Test instruments
app.instruments.BTCJPY.name=Bitcoin/Japanese Yen
app.instruments.BTCJPY.priceMultiplier=100
app.instruments.BTCJPY.qtyMultiplier=1
app.instruments.BTCJPY.type=Cash

app.instruments.ETHJPY.name=Ethereum/Japanese Yen
app.instruments.ETHJPY.priceMultiplier=100
app.instruments.ETHJPY.qtyMultiplier=1
app.instruments.ETHJPY.type=Cash