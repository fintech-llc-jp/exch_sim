# Test Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false

# JWT Configuration for tests
jwt.secret=test-secret-key-for-testing-purposes-only-must-be-long-enough
jwt.expiration=86400000

# Server Configuration
server.port=8080

# User Configuration
app.users.file-path=./test-users.json

# Instrument Configuration
app.instruments.G_BTCJPY.name=G_BTCJPY
app.instruments.G_BTCJPY.priceMultiplier=1
app.instruments.G_BTCJPY.qtyMultiplier=1000
app.instruments.G_BTCJPY.type=Cash

app.instruments.G_FX_BTCJPY.name=G_FX_BTCJPY
app.instruments.G_FX_BTCJPY.priceMultiplier=1
app.instruments.G_FX_BTCJPY.qtyMultiplier=1000
app.instruments.G_FX_BTCJPY.type=FX

app.instruments.BTCJPY.name=BTCJPY
app.instruments.BTCJPY.priceMultiplier=1
app.instruments.BTCJPY.qtyMultiplier=1000
app.instruments.BTCJPY.type=Cash

app.instruments.ETHJPY.name=ETHJPY
app.instruments.ETHJPY.priceMultiplier=1
app.instruments.ETHJPY.qtyMultiplier=1000
app.instruments.ETHJPY.type=Cash