# Test Configuration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false

# JWT Configuration for tests
jwt.secret=test-secret-key-for-testing-purposes-only-must-be-long-enough
jwt.expiration=86400000

# Server Configuration
server.port=0

# Market Data Client Configuration for Tests (disable WebSocket clients)
market-data.bitflyer.enabled=false
market-data.gmo.enabled=false

# Data Migration Configuration for Tests
app.data-migration.enabled=false
app.data-migration.phase=test
app.data-migration.memory-cache-enabled=true
app.data-migration.database-persistence-enabled=false
app.data-migration.migrate-positions=false
app.data-migration.migrate-trade-history=false
app.data-migration.bigquery-enabled=false

# Redis Configuration for tests (disable)
redis.pubsub.enabled=false

# Authentication Configuration for tests
# No BigQuery authentication in tests - mock or disable authentication

# Instrument Configuration
app.instruments.G_BTCJPY.name=G_BTCJPY
app.instruments.G_BTCJPY.priceMultiplier=1
app.instruments.G_BTCJPY.qtyMultiplier=1000
app.instruments.G_BTCJPY.type=Cash

app.instruments.G_FX_BTCJPY.name=G_FX_BTCJPY
app.instruments.G_FX_BTCJPY.priceMultiplier=1
app.instruments.G_FX_BTCJPY.qtyMultiplier=1000
app.instruments.G_FX_BTCJPY.type=FX

app.instruments.BTCJPY.name=BTCJPY
app.instruments.BTCJPY.priceMultiplier=1
app.instruments.BTCJPY.qtyMultiplier=1000
app.instruments.BTCJPY.type=Cash

app.instruments.ETHJPY.name=ETHJPY
app.instruments.ETHJPY.priceMultiplier=1
app.instruments.ETHJPY.qtyMultiplier=1000
app.instruments.ETHJPY.type=Cash