# PostgreSQL用の設定ファイル
# 使用例: java -jar app.jar --spring.profiles.active=postgresql

# Database Configuration
app.database.type=postgresql

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/exch_sim
spring.datasource.username=postgres
spring.datasource.password=postgres123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Data Migration Configuration
app.data-migration.enabled=true
app.data-migration.memory-cache-enabled=true
app.data-migration.database-persistence-enabled=true

# BigQueryは無効化（PostgreSQLのみ使用）
app.data-migration.bigquery-enabled=false

# Authentication Configuration
app.auth.bigquery-enabled=false

