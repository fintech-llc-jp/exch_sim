# Database Configuration
# PostgreSQL only configuration
app.database.type=postgresql

# Data Migration Configuration
app.data-migration.enabled=true
app.data-migration.phase=add-persistence
app.data-migration.memory-cache-enabled=true
app.data-migration.database-persistence-enabled=true
app.data-migration.migrate-positions=true
app.data-migration.migrate-trade-history=true
app.data-migration.bigquery-enabled=false


# PostgreSQL Configuration (app.database.type=postgresql の場合に使用)
# 環境変数で設定可能（デフォルトはlocalhost）
# DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD で設定可能
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:exch_sim}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# HikariCP Connection Pool Configuration
# connection-timeout: 接続確立のタイムアウト（ミリ秒）- 短縮してスタックを防止
spring.datasource.hikari.connection-timeout=10000
# maximum-pool-size: 最大接続数（メモリ使用量削減のため3に削減）
spring.datasource.hikari.maximum-pool-size=3
# minimum-idle: 最小アイドル接続数 - 0にしてlazy initializationを有効化（起動時の接続スタックを防止）
spring.datasource.hikari.minimum-idle=0
# idle-timeout: アイドル接続のタイムアウト（ミリ秒）
spring.datasource.hikari.idle-timeout=600000
# max-lifetime: 接続の最大生存時間（ミリ秒）
spring.datasource.hikari.max-lifetime=1800000
# validation-timeout: 接続検証のタイムアウト（ミリ秒）
spring.datasource.hikari.validation-timeout=3000
# connection-test-query: 接続検証用のクエリ
spring.datasource.hikari.connection-test-query=SELECT 1
# initialization-fail-timeout: 初期化失敗時のタイムアウト（ミリ秒）- -1で無効化（起動をブロックしない）
spring.datasource.hikari.initialization-fail-timeout=-1

# Market Board Snapshot Configuration (PostgreSQLモードのみ)
# 板データのスナップショットを記録（CPU使用率を考慮して間隔を調整可能）
# スナップショット取得間隔（ミリ秒）- アルゴトレーニング用に30秒間隔（メモリ使用量を削減）
# 1秒=1000ms、2秒=2000ms、5秒=5000ms、10秒=10000ms、30秒=30000ms
# アルゴトレーニングに使用する場合は、30秒間隔でも十分なデータが取得できます
app.market-board.snapshot.interval-ms=30000
# スナップショット取得レベル数 - アルゴトレーニング用に3レベル（メモリ使用量を削減）
# 3レベルでもアルゴトレーニングには十分なデータが取得できます
app.market-board.snapshot.max-levels=3
# スナップショット機能を無効化（Rustプロセスに移行）
# Rustプロセスが独自にWebSocketに接続してスナップショットを取得・保存します
app.market-board.snapshot.enabled=false
# 古いデータの削除: 起動時に実行、24時間以上古いデータを削除（market_board_snapshots と executions）
app.market-board.snapshot.retention-hours=24

# PostgreSQL Writer Configuration (非同期キュー処理)
# バッチサイズ: 一度に保存するスナップショット数（大きいほど書き込み頻度が減り、CPU使用率が削減）
# メモリ使用量を削減するため、バッチサイズを増やして書き込み頻度を減らす
app.postgresql.writer.batch-size=50
# キューサイズの上限: メモリ不足を防ぐため、キューサイズに制限を設定（デフォルト: 1000）
# キューが満杯の場合、古いスナップショットを破棄して新しいものを追加
app.postgresql.writer.queue-size-limit=500
# キューが空の時のスリープ時間（ミリ秒）- デフォルト500ms（CPU使用率を削減）
# BlockingQueue.take()を使用するため、この設定は主にシャットダウン時の動作に影響
app.postgresql.writer.empty-queue-sleep-ms=500

# User Migration Configuration
# BigQueryからPostgreSQLへユーザーデータを自動移行する（起動時）
app.database.migrate-users-from-bigquery=true

# Authentication Configuration
app.auth.bigquery-enabled=false

