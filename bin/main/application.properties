app.default-users[2].roles=ROLE_MARKET_MAKER,ROLE_USER

# Market Data Configuration
# Bitflyer Configuration (Enhanced with application-level keepalive)
market-data.bitflyer.enabled=true
market-data.bitflyer.ws-url=wss://ws.lightstream.bitflyer.com/json-rpc
market-data.bitflyer.reconnect-delay=1000
market-data.bitflyer.max-reconnect-attempts=30

# GMO Configuration
market-data.gmo.enabled=true
market-data.gmo.ws-url=wss://api.coin.z.com/ws/public/v1
market-data.gmo.reconnect-delay=1000
market-data.gmo.max-reconnect-attempts=20

# Symbol Mapping Configuration
# Bitflyer Mapping
market-data.symbol-mapping.BITFLYER.BTC_JPY=B_BTCJPY
market-data.symbol-mapping.BITFLYER.FX_BTC_JPY=B_FX_BTCJPY
# GMO Mapping (要確認: 実際のGMO APIの仕様と一致しているか)
# GMO.BTC_JPY (現物?) → G_FX_BTCJPY (FX扱い) - 矛盾の可能性
# GMO.BTC (FX?) → G_BTCJPY (現物扱い) - 矛盾の可能性
market-data.symbol-mapping.GMO.BTC_JPY=G_FX_BTCJPY
market-data.symbol-mapping.GMO.BTC=G_BTCJPY

# Data Processing Configuration
# CPU使用率を削減するため、レベル数とバッチサイズを調整
market-data.board.max-levels=5
market-data.trade.batch-size=200

# Market Data Update Rate Limiting
# Minimum interval between market board updates per symbol (milliseconds)
# This prevents overwhelming BigQuery with too many updates from high-frequency delta messages
# CPU使用率を削減するため、5秒間隔に延長
market-data.update-interval-ms=5000

# Async Processing Configuration
# CPU使用率を削減するため、スレッドプールサイズを削減
market-data.async.core-pool-size=2
market-data.async.max-pool-size=4
market-data.async.queue-capacity=500
market-data.async.thread-name-prefix=MarketData-

# Phase 3: Order Guarantee Configuration
market-data.trade.ordering.enabled=true
market-data.trade.ordering.shutdown-timeout=5000

# Phase 3: H2 Data Retention Configuration
market-data.h2.retention-days=7
market-data.h2.max-records=10000000
market-data.h2.cleanup.enabled=true
market-data.h2.cleanup.batch-size=1000
market-data.h2.emergency-cleanup-threshold=0.9

